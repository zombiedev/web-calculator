<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none">
    <title>Калькулятор</title>
    <style>
        :root {
            --bg-body: linear-gradient(135deg, #141e30, #243b55); --bg-calc: #1e293b; --bg-display: #0f172a;
            --text-main: #f8fafc; --text-prev: #94a3b8; --btn-num: #334155; --btn-num-hover: #475569;
            --btn-num-text: #f8fafc; --btn-op: #f59e0b; --btn-op-hover: #d97706; --btn-op-text: #ffffff;
            --btn-func: #475569; --btn-func-hover: #64748b; --btn-func-text: #cbd5e1; --btn-clear: #ef4444;
            --btn-clear-hover: #dc2626; --btn-eq: #10b981; --btn-eq-hover: #059669; --menu-bg: #1e293b;
            --menu-border: #334155; --menu-item-hover: #334155;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; user-select: none; }
        body { width: 100vw; height: 100vh; overflow: hidden; background: #000000; position: relative; }
        #snowCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; display: none; }
        #snowCanvas.active { display: block; }
        .app-wrapper { display: flex; justify-content: center; align-items: center; width: 100%; height: 100%; background: var(--bg-body); padding: 16px; position: relative; z-index: 2; }
        .calculator { position: relative; z-index: 3; background: var(--bg-calc); padding: 20px; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.4); width: 100%; max-width: 340px; display: flex; flex-direction: column; justify-content: center; }
        .calc-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; position: relative; height: 40px; width: 100%; gap: 10px; }
        .theme-menu-container { position: relative; flex-shrink: 0; }
        .theme-btn, .lang-btn { background: var(--btn-num); color: var(--text-main); border: 1px solid var(--menu-border); padding: 8px 14px; border-radius: 10px; cursor: pointer; font-weight: 500; font-size: 0.85rem; transition: background 0.2s; white-space: nowrap; }
        .theme-btn:hover, .lang-btn:hover { background: var(--btn-num-hover); }
        .lang-btn { flex-shrink: 0; width: auto; min-width: 45px; text-align: center; }
        .theme-dropdown { display: none; position: absolute; left: 0; top: 38px; background: var(--menu-bg); border: 1px solid var(--menu-border); border-radius: 10px; min-width: 165px; box-shadow: 0 8px 24px rgba(0,0,0,0.3); overflow: hidden; z-index: 10; }
        .theme-dropdown.show { display: block; }
        .theme-item { padding: 10px 14px; color: var(--text-main); cursor: pointer; font-size: 0.85rem; text-align: left; width: 100%; background: none; border: none; }
        .theme-item:hover { background: var(--menu-item-hover); }
        .color-picker-panel { display: none; align-items: center; justify-content: space-around; gap: 4px; background: var(--btn-num); padding: 8px 14px; border-top: 1px solid var(--menu-border); width: 100%; height: auto; }
        .color-picker-panel.active { display: flex; }
        .color-group { display: flex; align-items: center; gap: 4px; }
        .color-group label { color: var(--text-main); font-size: 0.75rem; font-weight: 600; }
        input[type="color"] { border: none; width: 22px; height: 22px; border-radius: 50%; cursor: pointer; background: none; padding: 0; }
        .display { background: var(--bg-display); color: var(--text-main); text-align: right; padding: 16px; border-radius: 16px; margin-bottom: 16px; min-height: 90px; display: flex; flex-direction: column; justify-content: flex-end; word-wrap: break-word; word-break: break-all; }
        .display .previous { color: var(--text-prev); font-size: 1rem; margin-bottom: 4px; min-height: 1.2rem; }
        .display .current { font-size: 2rem; font-weight: 600; }
        .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; width: 100%; }
        button { border: none; padding: 16px 0; width: 100%; border-radius: 14px; font-size: 1.25rem; font-weight: 600; cursor: pointer; text-align: center; transition: background 0.1s, transform 0.05s; }
        button:active { transform: scale(0.92); }
        .number { background: var(--btn-num); color: var(--btn-num-text); }
        .number:hover { background: var(--btn-num-hover); }
        .operator { background: var(--btn-op); color: var(--btn-op-text); }
        .operator:hover { background: var(--btn-op-hover); }
        .function { background: var(--btn-func); color: var(--btn-func-text); font-size: 1.1rem; }
        .function:hover { background: var(--btn-func-hover); }
        .clear { background: var(--btn-clear); color: #ffffff; }
        .clear:hover { background: var(--btn-clear-hover); }
        .equals { grid-column: span 2; background: var(--btn-eq); color: #ffffff; }
        .equals:hover { background: var(--btn-eq-hover); }
    </style>
</head>
<body>
    <canvas id="snowCanvas"></canvas>
    <div class="app-wrapper" id="appWrapper">
        <div class="calculator">
            <div class="calc-header">
                <div class="theme-menu-container">
                    <button class="theme-btn" id="themeBtn">Меню тем</button>
                    <div class="theme-dropdown" id="themeDropdown">
                        <button class="theme-item" data-i18n="theme-dark" onclick="setTheme('dark')">Тёмная</button>
                        <button class="theme-item" data-i18n="theme-light" onclick="setTheme('light')">Светлая</button>
                        <button class="theme-item" data-i18n="theme-cyberpunk" onclick="setTheme('cyberpunk')">Киберпанк</button>
                        <button class="theme-item" data-i18n="theme-purple" onclick="setTheme('purple')">Аметист</button>
                        <button class="theme-item" data-i18n="theme-winter" onclick="setTheme('winter')">❄️ Зимняя тема</button>
                        <button class="theme-item" data-i18n="theme-custom" onclick="setTheme('custom')">Своя тема</button>
                        <div class="color-picker-panel" id="pickerPanel">
                            <div class="color-group"><label>1:</label><input type="color" id="color1" value="#1e293b"></div>
                            <div class="color-group"><label>2:</label><input type="color" id="color2" value="#ff5500"></div>
                        </div>
                    </div>
                </div>
                <button class="lang-btn" id="langBtn" onclick="toggleLanguage()">EN</button>
            </div>
            <div class="display">
                <div class="previous" id="previous-operand"></div>
                <div class="current" id="current-operand">0</div>
            </div>
            <div class="buttons">
                <button class="clear" onclick="clearDisplay()">AC</button>
                <button class="function" id="delBtn" onclick="deleteNumber()">DEL</button>
                <button class="function" onclick="appendOperator('%')">%</button>
                <button class="operator" onclick="appendOperator('/')">÷</button>
                <button class="number" onclick="appendNumber('7')">7</button>
                <button class="number" onclick="appendNumber('8')">8</button>
                <button class="number" onclick="appendNumber('9')">9</button>
                <button class="operator" onclick="appendOperator('*')">×</button>
                <button class="number" onclick="appendNumber('4')">4</button>
                <button class="number" onclick="appendNumber('5')">5</button>
                <button class="number" onclick="appendNumber('6')">6</button>
                <button class="operator" onclick="appendOperator('-')">-</button>
                <button class="number" onclick="appendNumber('1')">1</button>
                <button class="number" onclick="appendNumber('2')">2</button>
                <button class="number" onclick="appendNumber('3')">3</button>
                <button class="operator" onclick="appendOperator('+')">+</button>
                <button class="number" onclick="appendNumber('0')">0</button>
                <button class="number" onclick="appendNumber('.')">.</button>
                <button class="equals" onclick="calculate()">=</button>
            </div>
        </div>
    </div>

    <script>
        const previousText = document.getElementById('previous-operand');
        const currentText = document.getElementById('current-operand');
        const themeBtn = document.getElementById('themeBtn');
        const themeDropdown = document.getElementById('themeDropdown');
        const pickerPanel = document.getElementById('pickerPanel');
        const langBtn = document.getElementById('langBtn');
        const delBtn = document.getElementById('delBtn');

        let currentLanguage = 'ru';

        const i18n = {
            ru: {
                themeBtn: "Меню тем",
                delBtn: "DEL",
                "theme-dark": "Тёмная",
                "theme-light": "Светлая",
                "theme-cyberpunk": "Киберпанк",
                "theme-purple": "Аметист",
                "theme-winter": "❄️ Зимняя тема",
                "theme-custom": "Своя тема"
            },
            en: {
                themeBtn: "Themes",
                delBtn: "BACK",
                "theme-dark": "Dark",
                "theme-light": "Light",
                "theme-cyberpunk": "Cyberpunk",
                "theme-purple": "Amethyst",
                "theme-winter": "❄️ Winter Theme",
                "theme-custom": "Custom Theme"
            }
        };

        function toggleLanguage() {
            currentLanguage = currentLanguage === 'ru' ? 'en' : 'ru';
            langBtn.innerText = currentLanguage === 'ru' ? 'EN' : 'RU';
            updateInterfaceLanguage();
        }

        function updateInterfaceLanguage() {
            themeBtn.innerText = i18n[currentLanguage].themeBtn;
            delBtn.innerText = i18n[currentLanguage].delBtn;
            
            document.querySelectorAll('[data-i18n]').forEach(element => {
                const key = element.getAttribute('data-i18n');
                if (i18n[currentLanguage][key]) {
                    element.innerText = i18n[currentLanguage][key];
                }
            });
        }

        themeBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            themeDropdown.classList.toggle('show');
        });

        document.addEventListener('click', () => {
            themeDropdown.classList.remove('show');
        });

        function setTheme(theme) {
            pickerPanel.classList.remove('active');
            document.getElementById('snowCanvas').classList.remove('active');
            
            if (theme === 'dark') {
                document.documentElement.style.setProperty('--bg-calc', '#1e293b');
                document.documentElement.style.setProperty('--text-main', '#f8fafc');
            } else if (theme === 'light') {
                document.documentElement.style.setProperty('--bg-calc', '#ffffff');
                document.documentElement.style.setProperty('--text-main', '#0f172a');
            } else if (theme === 'cyberpunk') {
                document.documentElement.style.setProperty('--bg-calc', '#000000');
                document.documentElement.style.setProperty('--text-main', '#00ff66');
            } else if (theme === 'purple') {
                document.documentElement.style.setProperty('--bg-calc', '#2e1065');
                document.documentElement.style.setProperty('--text-main', '#f472b6');
            } else if (theme === 'winter') {
                document.documentElement.style.setProperty('--bg-calc', '#e2e8f0');
                document.documentElement.style.setProperty('--text-main', '#1e3a8a');
                document.getElementById('snowCanvas').classList.add('active');
                initSnow();
            } else if (theme === 'custom') {
                pickerPanel.classList.add('active');
            }
        }

        let currentInput = '';
        let previousInput = '';
        let operation = null;

        function appendNumber(num) {
            if (num === '.' && currentText.innerText.includes('.')) return;
            if (currentText.innerText === '0' && num !== '.') currentInput = '';
            currentInput += num;
            currentText.innerText = currentInput;
        }

        function appendOperator(op) {
            if (currentInput === '') return;
            if (previousInput !== '') calculate();
            operation = op;
            previousInput = currentInput;
            currentInput = '';
            previousText.innerText = `${previousInput} ${op}`;
            currentText.innerText = '0';
        }

        function clearDisplay() {
            currentInput = '';
            previousInput = '';
            operation = null;
            currentText.innerText = '0';
            previousText.innerText = '';
        }

        function deleteNumber() {
            currentInput = currentInput.toString().slice(0, -1);
            currentText.innerText = currentInput || '0';
        }

        function calculate() {
            let result;
            const prev = parseFloat(previousInput);
            const current = parseFloat(currentInput);
            if (isNaN(prev) || isNaN(current)) return;

            switch (operation) {
                case '+': result = prev + current; break;
                case '-': result = prev - current; break;
                case '*': result = prev * current; break;
                case '/': result = current === 0 ? 'Ошибка' : prev / current; break;
                case '%': result = (prev * current) / 100; break;
                default: return;
            }

            currentInput = result;
            operation = null;
            previousInput = '';
            currentText.innerText = result;
            previousText.innerText = '';
        }

        function initSnow() {
            const canvas = document.getElementById('snowCanvas');
            const ctx = canvas.getContext('2d');
            let width = canvas.width = window.innerWidth;
            let height = canvas.height = window.innerHeight;
            
            const flakes = Array.from({ length: 50 }, () => ({
                x: Math.random() * width,
                y: Math.random() * height,
                r: Math.random() * 3 + 1,
                d: Math.random() * 1
            }));

            function draw() {
                if (!canvas.classList.contains('active')) return;
                ctx.clearRect(0, 0, width, height);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.beginPath();
                flakes.forEach(f => {
                    ctx.moveTo(f.x, f.y);
                    ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2, true);
                    f.y += Math.cos(f.d) + 1 + f.r / 2;
                    f.x += Math.sin(f.d) * 0.5;
                    if (f.y > height) {
                        f.y = -10;
                        f.x = Math.random() * width;
                    }
                });
                ctx.fill();
                requestAnimationFrame(draw);
            }
            window.addEventListener('resize', () => {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            });
            draw();
        }
    </script>
</body>
</html>
