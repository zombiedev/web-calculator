<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none">
    <title>Калькулятор</title>
    <style>
        :root {
            --bg-body: linear-gradient(135deg, #141e30, #243b55); --bg-calc: #1e293b; --bg-display: #0f172a;
            --text-main: #f8fafc; --text-prev: #94a3b8; --btn-num: #334155; --btn-num-hover: #475569;
            --btn-num-text: #f8fafc; --btn-op: #f59e0b; --btn-op-hover: #d97706; --btn-op-text: #ffffff;
            --btn-func: #475569; --btn-func-hover: #64748b; --btn-func-text: #cbd5e1; --btn-clear: #ef4444;
            --btn-clear-hover: #dc2626; --btn-eq: #10b981; --btn-eq-hover: #059669; --menu-bg: #1e293b;
            --menu-border: #334155; --menu-item-hover: #334155;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; user-select: none; }
        body { width: 100vw; height: 100vh; overflow: hidden; background: #000000; position: relative; }
        #snowCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; display: none; }
        #snowCanvas.active { display: block; }
        .app-wrapper { display: flex; justify-content: center; align-items: center; width: 100%; height: 100%; background: var(--bg-body); padding: 16px; position: relative; z-index: 2; }
        .calculator { position: relative; z-index: 3; background: var(--bg-calc); padding: 20px; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.4); width: 100%; max-width: 340px; display: flex; flex-direction: column; justify-content: center; }
        .calc-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; position: relative; height: 40px; width: 100%; }
        .theme-menu-container { position: relative; }
        .theme-btn { background: var(--btn-num); color: var(--text-main); border: 1px solid var(--menu-border); padding: 8px 14px; border-radius: 10px; cursor: pointer; font-weight: 500; font-size: 0.85rem; }
        .theme-dropdown { display: none; position: absolute; left: 0; top: 38px; background: var(--menu-bg); border: 1px solid var(--menu-border); border-radius: 10px; min-width: 165px; box-shadow: 0 8px 24px rgba(0,0,0,0.3); overflow: hidden; z-index: 10; }
        .theme-dropdown.show { display: block; }
        .theme-item { padding: 10px 14px; color: var(--text-main); cursor: pointer; font-size: 0.85rem; text-align: left; width: 100%; background: none; border: none; }
        .theme-item:hover { background: var(--menu-item-hover); }
        .color-picker-panel { display: none; align-items: center; justify-content: space-around; gap: 4px; background: var(--btn-num); padding: 8px 14px; border-top: 1px solid var(--menu-border); width: 100%; height: auto; }
        .color-picker-panel.active { display: flex; }
        .color-group { display: flex; align-items: center; gap: 4px; }
        .color-group label { color: var(--text-main); font-size: 0.75rem; font-weight: 600; }
        input[type="color"] { border: none; width: 22px; height: 22px; border-radius: 50%; cursor: pointer; background: none; padding: 0; }
        .display { background: var(--bg-display); color: var(--text-main); text-align: right; padding: 16px; border-radius: 16px; margin-bottom: 16px; min-height: 90px; display: flex; flex-direction: column; justify-content: flex-end; word-wrap: break-word; word-break: break-all; }
        .display .previous { color: var(--text-prev); font-size: 1rem; margin-bottom: 4px; min-height: 1.2rem; }
        .display .current { font-size: 2rem; font-weight: 600; }
        .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; width: 100%; }
        button { border: none; padding: 16px 0; width: 100%; border-radius: 14px; font-size: 1.25rem; font-weight: 600; cursor: pointer; text-align: center; transition: background 0.1s, transform 0.05s; }
        button:active { transform: scale(0.92); }
        .number { background: var(--btn-num); color: var(--btn-num-text); }
        .number:hover { background: var(--btn-num-hover); }
        .operator { background: var(--btn-op); color: var(--btn-op-text); }
        .operator:hover { background: var(--btn-op-hover); }
        .function { background: var(--btn-func); color: var(--btn-func-text); }
        .function:hover { background: var(--btn-func-hover); }
        .clear { background: var(--btn-clear); color: #ffffff; }
        .clear:hover { background: var(--btn-clear-hover); }
        .equals { grid-column: span 2; background: var(--btn-eq); color: #ffffff; }
        .equals:hover { background: var(--btn-eq-hover); }
    </style>
</head>
<body>
    <canvas id="snowCanvas"></canvas>
    <div class="app-wrapper" id="appWrapper">
        <div class="calculator">
            <div class="calc-header">
                <div class="theme-menu-container">
                    <button class="theme-btn" id="themeBtn">Меню тем</button>
                    <div class="theme-dropdown" id="themeDropdown">
                        <button class="theme-item" onclick="setTheme('dark')">Тёмная</button>
                        <button class="theme-item" onclick="setTheme('light')">Светлая</button>
                        <button class="theme-item" onclick="setTheme('cyberpunk')">Киберпанк</button>
                        <button class="theme-item" onclick="setTheme('purple')">Аметист</button>
                        <button class="theme-item" onclick="setTheme('winter')">❄️ Зимняя тема</button>
                        <button class="theme-item" onclick="setTheme('custom')">Своя тема</button>
                        <div class="color-picker-panel" id="pickerPanel">
                            <div class="color-group"><label>1:</label><input type="color" id="color1" value="#1e293b"></div>
                            <div class="color-group"><label>2:</label><input type="color" id="color2" value="#ff5500"></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="display">
                <div class="previous" id="previous-operand"></div>
                <div class="current" id="current-operand">0</div>
            </div>
            <div class="buttons">
                <button class="clear" onclick="clearDisplay()">AC</button>
                <button class="function" onclick="deleteNumber()">DEL</button>
                <button class="function" onclick="appendOperator('%')">%</button>
                <button class="operator" onclick="appendOperator('/')">÷</button>
                <button class="number" onclick="appendNumber('7')">7</button>
                <button class="number" onclick="appendNumber('8')">8</button>
                <button class="number" onclick="appendNumber('9')">9</button>
                <button class="operator" onclick="appendOperator('*')">×</button>
                <button class="number" onclick="appendNumber('4')">4</button>
                <button class="number" onclick="appendNumber('5')">5</button>
                <button class="number" onclick="appendNumber('6')">6</button>
                <button class="operator" onclick="appendOperator('-')">-</button>
                <button class="number" onclick="appendNumber('1')">1</button>
                <button class="number" onclick="appendNumber('2')">2</button>
                <button class="number" onclick="appendNumber('3')">3</button>
                <button class="operator" onclick="appendOperator('+')">+</button>
                <button class="number" onclick="appendNumber('0')">0</button>
                <button class="number" onclick="appendNumber('.')">.</button>
                <button class="equals" onclick="calculate()">=</button>
            </div>
        </div>
    </div>
    <script>
        const previousText = document.getElementById('previous-operand'), currentText = document.getElementById('current-operand');
        const themeBtn = document.getElementById('themeBtn'), themeDropdown = document.getElementById('themeDropdown');
        const pickerPanel = document.getElementById('pickerPanel'), color1Input = document.getElementById('color1'), color2Input = document.getElementById('color2');
        const canvas = document.getElementById('snowCanvas'), ctx = canvas.getContext('2d'), appWrapper = document.getElementById('appWrapper');
        let currentOperand = '0', previousOperand = '', operation = undefined, snowflakes = [], animId = null;

        themeBtn.addEventListener('click', (e) => { e.stopPropagation(); themeDropdown.classList.toggle('show'); });
        themeDropdown.addEventListener('click', (e) => { e.stopPropagation(); });
        document.addEventListener('click', () => themeDropdown.classList.remove('show'));
        color1Input.addEventListener('input', () => applyCustomColors(color1Input.value, color2Input.value));
        color2Input.addEventListener('input', () => applyCustomColors(color1Input.value, color2Input.value));

        const presets = {
            dark: ['#1e293b', '#f59e0b'], light: ['#ffffff', '#3b82f6'],
            cyberpunk: ['#0d0d0d', '#ff007f'], purple: ['#3b0764', '#d946ef'], winter: ['#1e2749', '#4b6584']
        };

        function setTheme(themeName) {
            pickerPanel.classList.toggle('active', themeName === 'custom');
            toggleSnow(themeName === 'winter');
            const colors = themeName === 'custom' ? [color1Input.value, color2Input.value] : presets[themeName];
            applyCustomColors(colors[0], colors[1]);
            if (themeName !== 'custom') themeDropdown.classList.remove('show');
            localStorage.setItem('calculator-theme', themeName);
        }

        function applyCustomColors(hex1, hex2) {
            localStorage.setItem('calculator-hex1', hex1); localStorage.setItem('calculator-hex2', hex2);
            let r1 = parseInt(hex1.slice(1,3),16), g1 = parseInt(hex1.slice(3,5),16), b1 = parseInt(hex1.slice(5,7),16);
            let r2 = parseInt(hex2.slice(1,3),16), g2 = parseInt(hex2.slice(3,5),16), b2 = parseInt(hex2.slice(5,7),16);
            const adj = (v, a) => Math.max(0, Math.min(255, v + a)); const root = document.documentElement;
            
            const isL = (hex1==='#ffffff'), isC = (hex1==='#0d0d0d'), isW = (hex1==='#1e2749');
            appWrapper.style.background = isW ? 'transparent' : 'var(--bg-body)';
            document.body.style.background = isW ? 'linear-gradient(135deg, #0f2027, #203a43, #2c5364)' : '#000000';

            root.style.setProperty('--bg-body', isL ? 'linear-gradient(135deg, #e2e8f0, #cbd5e1)' : isC ? 'linear-gradient(135deg, #000, #1a0033)' : `linear-gradient(135deg, rgb(${adj(r1,-40)},${adj(g1,-40)},${adj(b1,-40)}), rgb(${adj(r1,+20)},${adj(g1,+20)},${adj(b1,+20)}))`);
            root.style.setProperty('--bg-calc', hex1);
            root.style.setProperty('--bg-display', isL ? '#f1f5f9' : isC ? '#141414' : isW ? '#0f172a' : `rgb(${adj(r1,-50)},${adj(g1,-50)},${adj(b1,-50)})`);
            root.style.setProperty('--text-main', isL ? '#0f172a' : isC ? '#39ff14' : '#ffffff');
            root.style.setProperty('--text-prev', isL ? '#64748b' : isC ? '#00ffff' : isW ? '#5b73a7' : `rgb(${adj(r1,+60)},${adj(g1,+60)},${adj(b1,+60)})`);
            root.style.setProperty('--btn-num', isL ? '#e2e8f0' : isC ? '#1f1f1f' : isW ? '#2c3e50' : `rgb(${adj(r1,+20)},${adj(g1,+20)},${adj(b1,+20)})`);
            root.style.setProperty('--btn-num-hover', isL ? '#cbd5e1' : isC ? '#2d2d2d' : isW ? '#34495e' : `rgb(${adj(r1,+40)},${adj(g1,+40)},${adj(b1,+40)})`);
            root.style.setProperty('--btn-num-text', isL ? '#0f172a' : isC ? '#39ff14' : '#ffffff');
            root.style.setProperty('--btn-func', isL ? '#cbd5e1' : isC ? '#262626' : isW ? '#1a2537' : `rgb(${adj(r1,-20)},${adj(g1,-20)},${adj(b1,-20)})`);
            root.style.setProperty('--btn-func-hover', isL ? '#94a3b8' : isC ? '#3a3a3a' : isW ? '#111a28' : `rgb(${adj(r1,-10)},${adj(g1,-10)},${adj(b1,-10)})`);
            root.style.setProperty('--btn-func-text', isL ? '#334155' : isC ? '#00ffff' : '#b5c6e0');
            root.style.setProperty('--menu-bg', hex1);
            root.style.setProperty('--menu-item-hover', isL ? '#f1f5f9' : isC ? '#262626' : isW ? '#2c3e50' : `rgb(${adj(r1,+20)},${adj(g1,+20)},${adj(b1,+20)})`);
            root.style.setProperty('--btn-op', hex2); root.style.setProperty('--btn-op-hover', `rgb(${adj(r2,-30)},${adj(g2,-30)},${adj(b2,-30)})`);
            root.style.setProperty('--btn-eq', isC ? '#00ffff' : isW ? '#2980b9' : `rgb(${adj(r2,-20)},${adj(g2,-20)},${adj(b2,-20)})`);
            root.style.setProperty('--btn-eq-hover', isC ? '#00cccc' : hex2); root.style.setProperty('--menu-border', hex2);
            root.style.setProperty('--btn-clear', isL || isW ? '#e74c3c' : '#ef4444'); root.style.setProperty('--btn-clear-hover', isL || isW ? '#c0392b' : '#dc2626');
        }

        function toggleSnow(start) {
            if (!start) { canvas.classList.remove('active'); cancelAnimationFrame(animId); animId = null; return; }
            canvas.classList.add('active'); canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            snowflakes = Array.from({length: 60}, () => ({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, r: Math.random()*3+1, v: Math.random()*1+0.6 }));
            if (!animId) loop();
        }
        function loop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.fillStyle = "rgba(255,255,255,0.85)"; ctx.beginPath();
            snowflakes.forEach(f => { ctx.moveTo(f.x, f.y); ctx.arc(f.x, f.y, f.r, 0, Math.PI*2); f.y += f.v; if(f.y > canvas.height) f.y = 0; });
            ctx.fill(); animId = requestAnimationFrame(loop);
        }
        window.addEventListener('resize', () => { if(animId) { canvas.width = window.innerWidth; canvas.height = window.innerHeight; } });

        const savedTheme = localStorage.getItem('calculator-theme') || 'dark';
        if (localStorage.getItem('calculator-hex1')) color1Input.value = localStorage.getItem('calculator-hex1');
        if (localStorage.getItem('calculator-hex2')) color2Input.value = localStorage.getItem('calculator-hex2');
        setTheme(savedTheme);

        document.addEventListener('keydown', (e) => {
            if (['/', '*', '-', '+', '%', 'Enter', 'Backspace', 'Escape'].includes(e.key)) e.preventDefault();
            if ((e.key >= '0' && e.key <= '9') || e.key === '.') appendNumber(e.key);
            if (['+', '-', '*', '/'].includes(e.key)) appendOperator(e.key);
            if (e.key === '%') appendOperator('%'); if (e.key === 'Enter' || e.key === '=') calculate();
            if (e.key === 'Backspace') deleteNumber(); if (e.key === 'Escape') clearDisplay();
        });
        function clearDisplay() { currentOperand = '0'; previousOperand = ''; operation = undefined; updateDisplay(); }
        function deleteNumber() { if (currentOperand === '0') return; currentOperand = currentOperand.toString().slice(0, -1); if (currentOperand === '') currentOperand = '0'; updateDisplay(); }
        function appendNumber(n) { if (n === '.' && currentOperand.includes('.')) return; currentOperand = (currentOperand === '0' && n !== '.') ? n.toString() : currentOperand + n; updateDisplay(); }
        function appendOperator(op) { if (currentOperand === '') return; if (previousOperand !== '') calculate(); operation = op; previousOperand = currentOperand; currentOperand = ''; updateDisplay(); }
        function calculate() {
            let res, p = parseFloat(previousOperand), c = parseFloat(currentOperand); if (isNaN(p) || isNaN(c)) return;
            if(operation==='+') res=p+c; if(operation==='-') res=p-c; if(operation==='*') res=p*c; if(operation==='%') res=(p/100)*c;
            if(operation==='/') { if(c===0) { alert("Деление на ноль!"); clearDisplay(); return; } res=p/c; }
            currentOperand = (Math.round(res * 1e10) / 1e10).toString(); operation = undefined; previousOperand = ''; updateDisplay();
        }
        function updateDisplay() { currentText.innerText = currentOperand; previousText.innerText = operation ? `${previousOperand} ${operation==='/'?'÷':operation==='*'?'×':operation}` : ''; }
    </script>
</body>
</html>
